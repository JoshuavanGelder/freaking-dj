name: DJ

# De app zet een verzoek in de branch dj-data (requests/<id>.json) en start deze workflow.
# Claude Code stelt met jouw Claude-abonnement (secret CLAUDE_CODE_OAUTH_TOKEN, gemaakt met
# `claude setup-token`) de wachtrij samen; het antwoord komt in dj-data/responses/<id>.json.
run-name: DJ ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Id van het verzoek in dj-data/requests
        required: true
        type: string

permissions:
  contents: write

jobs:
  dj:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      REQUEST_ID: ${{ inputs.request_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: dj

      - uses: actions/checkout@v4
        with:
          ref: dj-data
          path: data

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Claude Code installeren
        run: npm install -g @anthropic-ai/claude-code --no-audit --no-fund

      - name: Wachtrij samenstellen
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node dj/run.mjs "$REQUEST_ID" data

      - name: Antwoord terugzetten
        if: always()
        working-directory: data
        run: |
          if [ ! -f "responses/$REQUEST_ID.json" ]; then
            mkdir -p responses
            printf '{"id":"%s","status":"fout","message":"De workflow liep vast voordat Claude klaar was.","resetAt":null,"answer":null,"finishedAt":"%s"}\n' \
              "$REQUEST_ID" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "responses/$REQUEST_ID.json"
          fi
          git config user.name "freaking-dj"
          git config user.email "freaking-dj@users.noreply.github.com"
          git add -A requests responses
          git commit -q -m "DJ-antwoord $REQUEST_ID" || exit 0
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin dj-data && git push -q origin HEAD:dj-data && exit 0
            sleep $((i * 2))
          done
          exit 1
